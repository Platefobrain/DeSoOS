[package]
name = "nts-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test server for DeSoOS NTS / TLS exporter tests (host only, not part of the OS image)"

# Standalone: not a member of the DeSoOS package above.
[workspace]

[dependencies]
aes-siv = "0.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
