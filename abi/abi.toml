# DeSo OS ABI – the one source of truth for what a program may rely on (V081 plan, rules R1–R6).
# Edited by hand; tools/abigen.py checks it and generates docs/abi/SYSCALLS.md, sdk/libdeso/src/abi.rs and
# kernel/user/abi_generated.rs from it.  Rules (docs/abi/README.md): within one major version only ADD – never renumber,
# change or remove; a new entry gets since = the next minor, and that minor its own abi/abi-X.Y.lock.
#
# A syscall: number in rax, arguments in rdi, rsi, rdx, r10, r8, r9; the result in rax as i64 – >= 0 a value,
# < 0 an ERROR_* code.  Argument types: handle, ptr_in (the kernel reads it), ptr_out (the kernel writes it), len,
# u64, i64, flags.  `rights` = the kernel's rights table (kernel/user/sysrights.rs) for this call: path = the call
# names a path (refused in the file sandbox); handles = handle arguments (argument register 0-5, kinds, the rights
# they need, extra rights when a bit of another argument is set); in_call = handles the call checks itself.
# test_class: normal / stateful / blocking / hardware / terminal; test = where the entry is tested.

[abi]
version = "1.0"

[[syscall]]
number = 0
name = "SYS_EXIT"
since = "1.0"
status = "stable"
args = [{ name = "code", type = "i64", meaning = "exit code (0 = success)" }]
returns = "never"
errors = []
path = false
handles = []
in_call = ""
test_class = "terminal"
test = "abiprobe: a child exits with 7, the parent's wait sees 7"

