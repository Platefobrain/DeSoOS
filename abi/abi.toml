returns = "bytes written"
errors = ["ERROR_ACCESS_DENIED", "ERROR_CLOSED", "ERROR_INVALID_ADDRESS", "ERROR_INVALID_HANDLE", "ERROR_IO", "ERROR_NO_SPACE", "ERROR_OUT_OF_MEMORY"]
path = false
handles = [{ reg = 0, kinds = ["CONSOLE", "FILE", "PIPE"], need = ["WRITE"] }]
in_call = ""
test_class = "normal"
test = "abiprobe (gate) + FILE TEST"

